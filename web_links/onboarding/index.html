<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Evos</title>
<style>
  :root { --brand: #6D28D9; --ink: #1c1b22; --muted: #5f5a6b; --bg: #faf8fd; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebf2; --muted: #a9a4b6; --bg: #141218; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
         color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; padding: 2rem 1.25rem; text-align: center; }
  .logo { display: block; width: 72px; height: 72px; margin: 0 auto 1.25rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a.button { display: block; padding: .95rem 1rem; border-radius: 999px; background: var(--brand); color: #fff;
             text-decoration: none; font-weight: 600; }
  small { display: block; margin-top: 1.25rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <!-- The app icon: tool/app_icon/evos_rounded.svg. -->
  <svg class="logo" viewBox="0 0 108 108" aria-hidden="true">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#4C1D95"/>
      </linearGradient>
    </defs>
    <rect width="108" height="108" rx="23.76" fill="url(#bg)"/>
    <g transform="translate(54 54) scale(1.12) translate(-54 -54)" fill="#FFFFFF">
      <rect x="36" y="38" width="8" height="34" rx="4"/>
      <rect x="36" y="38" width="28" height="8" rx="4"/>
      <rect x="36" y="51" width="22" height="8" rx="4"/>
      <rect x="36" y="64" width="28" height="8" rx="4"/>
      <circle cx="71" cy="33" r="3.5" fill="#FBBF24"/>
    </g>
  </svg>
  <h1>Open Evos</h1>
  <p>Tap the button to continue in the app.</p>
  <!-- Names the app's package, so Chrome opens it even where Android has not
       verified this domain for the app. -->
  <a class="button" href="intent://notes-f36b3.web.app/onboarding#Intent;scheme=https;package=com.spacewire.evos;end">Open in the app</a>
  <small>Nothing happens? Install the test APK you were sent, then tap the link again.</small>
</main>
</body>
</html>
