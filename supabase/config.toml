# Only what differs from the Supabase CLI defaults. Run `supabase link --project-ref <ref>` once.
project_id = "evos"

# Cashfree and Supabase Auth call these two without a user token. Each checks its own signature.
[functions.cashfree-webhook]
verify_jwt = false

[functions.sms-hook]
verify_jwt = false

# The admin panel calls this from a browser with the publishable key (not a JWT)
# and authenticates itself with the x-admin-secret header, so platform JWT
# verification must be off or the gateway would reject it before the secret
# check runs.
[functions.admin-source-config]
verify_jwt = false

# The app calls this on first launch, before sign-in, with the publishable key (not a JWT).
# It stores nothing and returns only the decoded ad of the referrer it was sent.
[functions.meta-install-referrer]
verify_jwt = false
